name: Scheduler Workflow

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run scheduled job
        run: |
          echo "Scheduler workflow triggered at $(date -u)"
          echo "This workflow runs every Monday at 09:00 UTC."
